[project]
name = "dedaverse"
dynamic = ["version"]
dependencies = [
  "usd-core>=26.11",
  "PySide6>=6.12.0",
  "PyOpenGL",             # usdview's stage view (deda.core.viewer) imports OpenGL
  "p4python>=2025.2.2863679",
  "coloredlogs",
  "click",
  "packaging",
  "psutil",
  "dataclasses_json",
  "numpy",                # deda.core.ai
  "requests"
]
requires-python = ">= 3.13"
authors = [
  {name = "Ben Deda"}
]
maintainers = [
  {name = "Ben Deda"}
]
readme = "README.md"

[project.optional-dependencies]
media = [
  "OpenEXR>=3.5.2",  # EXR images and sequences in the viewer (deda.core.viewer._media)
]
trellis = [
  "gradio_client>=2.7.2",  # talks to the TRELLIS.2 Gradio server
]
imagegen = [
  "google-genai>=2.31.0",          # Imagen 3 / Gemini image generation (recommended)
  # "google-generativeai>=0.8", # Alternative: older Gemini SDK (fallback)
]
dev = [
  "bandit[toml]>=1.9.4",
  "pillow>=12.3.0",  # tests build fake images (tests/test_trellis2_fake_server.py)
  "pre-commit>=4.7.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "radon>=6.0.1",
]
fal = [
  "fal_client>=1.0.3",        # fal.ai hosted models (deda.plugins.fal)
]
upscale = [
  "torch>=2.14.1",
  "spandrel>=0.4.2",
  "huggingface_hub>=2.2.0",
]
raw_formats = [
  "pillow-heif>=1.8.1",
  "rawpy>=0.27.1",
]

[project.scripts]
dedaverse = "dedaverse.__main__:dedaverse"

[tool.setuptools.package-data]
"deda" = [
  "app/icons/*.png",
  "core/operation/templates/*.md",
  "core/operation/templates/examples/*",
  "plugins/*.png",
  "plugins/*/*.png",
  "plugins/*/icons/*.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "-m", "not network",
    "--tb=short",
    "--cov=src/deda",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "--cov-fail-under=0",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "network: marks tests that require network access (deselect with '-m \"not network\"' for offline unit runs)",
]

[tool.coverage.run]
source = ["src/deda"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = ["tests", ".*", "venv", ".venv"]
skips = ["B101", "B110"]  # B101 assert_used (tests); B110 try_except_pass (treat separately)
targets = ["src/deda"]

[tool.radon.complexity]
min = "C"
max_line_length = 120
exclude = ["tests/*", ".*", "*/venv/*", "*/.venv/*"]
no_assert = true
show_closures = false
total_average = true